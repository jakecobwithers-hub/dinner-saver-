# Refreshes specials.json from the Woolworths VIC weekly catalogue every morning (Melbourne time).
# The website reads specials.json when it opens, so new specials show up with no app update.
name: Update Woolworths specials
on:
  schedule:
    - cron: "30 19 * * *"   # 6:30am AEDT / 5:30am AEST, every day
    - cron: "30 4 * * 1,2,3" # 3:30pm AEDT Mon-Wed too, to catch next week's catalogue early
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: specials
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Read the catalogue
        run: python3 tools/update_specials.py specials.json
      - name: Learn regular prices from the catalogue
        run: python3 tools/derive_prices.py specials.json specials_map.json tools/library.json prices.json
      - name: Save if anything changed
        run: |
          if [ -z "$(git status --porcelain specials.json prices.json)" ]; then echo "No new specials."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specials.json; if [ -f prices.json ]; then git add prices.json; fi
          git commit -m "Update Woolworths specials"
          git push
